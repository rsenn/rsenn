<!-- shish live wallpaper, built from the Gemini concept sheets (art/source/).
     Characters are transparent PNG sprites (art/sprites/, cut out by make-sprites.py);
     "@/" in a href is the site root. Library in <defs>, cloned into the stage by wallpaper.js:
       actors  w-cat w-fish w-whale w-hookah w-tobacco w-shell w-dec w-chmod w-chown w-duo w-folder
       pipe    w-pipe (flow path for the little data packets)   fx  w-sparkle
       data-wag="deg,speed" data-pivot="x y"   sway around a pivot (feet)
       data-mood="happy|sad"                    two faces of one creature, cross-faded by the beat
       .emit data-kind="smoke|steam|bubble|sparkle|note|drop"   particle source -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<style>
  .flow{fill:none;stroke:none}
  .wisp{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round}
  .bub{fill:var(--teal-soft);stroke:var(--teal);stroke-width:2.5}
  .bubhi{fill:none;stroke:var(--bg);stroke-width:2.5;stroke-linecap:round}
  .panel{fill:var(--teal-soft);stroke:none}
  .cap{font:500 32px var(--mono);fill:var(--fg)}
  .sub{font:400 28px var(--mono);fill:var(--fg-muted)}
</style>
<defs>
  <g id="w-cat"><g data-wag="2.4,1.4" data-pivot="0 130"><image href="@/assets/sprites/cat.png" x="-138" y="-119" width="276" height="249"/></g></g>
