# Knowledge-source manifest for the mcu-firmware-engineer skill.
#
# Purpose: every place we've actually gone to find out HOW to implement
# something (chip capabilities/peripherals/pinout/registers, a driver
# contract, a library convention, a board detail) gets one entry here —
# not just PIC datasheets, though those are the most common case. This
# is a living, hand-editable index: add an entry whenever a source
# actually helped answer a real question during real work, don't
# pre-populate it speculatively.
#
# Lookup order when a question comes up ("how does peripheral X work",
# "what's the register/flag for Y"):
#   1. Check this file for an existing entry covering the topic/chip.
#   2. If a datasheet is listed but its `path` is missing on disk,
#      download it into ~/Dokumente/Microchip/ (see `datasheet` entries'
#      `path` convention below) and read it from there.
#   3. If nothing here covers it: consult MLA (registers/flags/contract
#      ONLY, per the `mla` entry below — never copy its source, never
#      its identifier style) or a general web search (vendor app notes,
#      tutorials, tech blogs like Hackaday, private sites like Roman
#      Black's). If a web source is actually used to figure something
#      out, add an entry for it here (download it if practical, or link
#      the URL) BEFORE moving on — don't let a real source of expertise
#      go unrecorded.
#
# Schema per entry (hand-editable, keep it this shape):
#   id:          short stable slug, referenced from elsewhere if needed
#   category:    datasheet | compiler-doc | app-note | library | project
#                | book | blog | forum | tutorial | reference-only | other
#   title:       real document/page title
#   topic:       chip(s)/peripheral(s)/subject this actually covers
#   path:        local file path, if downloaded/present (omit if not)
#   url:         source URL, if known/applicable (omit if purely local)
#   relevance:   WHY this is listed - what task/question it answered,
#                or the general reason it's kept around
#   status:      present | missing-needs-download | linked-only |
#                confidential-generalized-only
#   added:       YYYY-MM-DD this entry was added
#
# `category: reference-only` + `status: confidential-generalized-only`
# marks a source that is NOT ours to distribute or quote (e.g. a former
# employer's copyrighted production firmware): no path/url is recorded
# here, its filenames/product name are never written into this skill,
# and its actual source/comments/identifiers must never be copied or
# paraphrased. What WAS extracted is only generalized engineering
# principles, written in this skill's own words, kept in a separate file
# per the entry's `relevance` note - never in this manifest itself.

datasheets_dir: ~/Dokumente/Microchip/
datasheets_dir_note: >
  ~/Dokumente/Microchip/ holds ~173 Microchip PDFs total (datasheets,
  app notes, compiler/tool guides). Most chip datasheets are sensibly
  named (e.g. pic18f25k50.pdf); many app notes are only named by
  Microchip document number (e.g. 00002749A.pdf) and haven't been
  individually catalogued below yet - only add an entry here once a
  specific document has actually been consulted for something, per the
  step-by-step workflow. If a needed chip datasheet isn't in this
  directory, download it there and add an entry.

