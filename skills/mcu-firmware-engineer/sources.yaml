  - id: insider-debug-tool
    category: project
    title: "INSIDER - 1-bit in-circuit debugger (E.E. Atanasios Melimopoulos, pic.insider@gmail.com)"
    topic: >
      A DIY hardware ICD alternative for 8-bit PIC10/12/16/18: a separate
      PIC16F628-based debug pod talks to the target over a SINGLE spare
      I/O pin (any pin, any port, shareable with low-importance user
      hardware like a LED/pushbutton) via a self-clocking 512cyc/256cyc
      pulse-width-coded 1-bit link, instead of ICD's fixed RB6/RB7 2-bit
      interface. Target-side integration is a small assembly bootstrap
      (~160 words on 12F6xx, ~170 on 16Fxx, ~400 on 18Fxx) placed at the
      end of program memory plus two macros (`INSIDER`, `BREAK nn`)
      dropped at the reset init and at each breakpoint site; PC side is
      plain Hyperterminal at 38400bps, no MPLAB plug-in. Up to 256
      breakpoints (mask/unmask/trace by group), view/edit DATA/SFR RAM,
      read/write ports, EEPROM dump, W/STATUS edit, rerun from
      breakpoint (18Fxxxx also supports rerun-from-arbitrary-address).
    path: /mnt/data/Projects/pictest/insider/
    url: "local copy at /mnt/data/Projects/rsenn/insider/ (git-tracked, same author's files, lowercase-renamed - e.g. bootstrap/18fdbug.asm vs Bootstrap/18FDBUG_v1r1.asm - otherwise the same content byte-for-byte per file, not yet diffed further than that)"
    relevance: >
      Investigated 2026-08-29 as a candidate single-pin hardware/software
      breakpoint debugger for pictest-style PIC targets, as an
      alternative or complement to the `mdb` *simulator* round-trip above
      (INSIDER debugs the REAL chip on real hardware; mdb's Hwtool SIM
      never touches silicon) and to a real ICD when RB6/RB7 aren't free.
      Full protocol doc: `Source/INSIDER_Protocol.txt`; full command/
      concept doc: `INSIDER_User_Manual_en.pdf` (rsenn copy:
      `INSIDER_User_Manual.pdf`) — both read in full during this pass.
      **Portability finding (see SKILL.md's "Debug tools" section for
      the full writeup)**: the target-side bootstrap is genuinely
      assembly-only — its 1-bit link is bit-banged with fixed,
      cycle-counted delay loops (tuned per a `DBN` speed-multiplier EQU)
      that only work because MPASM emits deterministic per-instruction
      cycle counts; this cannot be reproduced by C codegen from either
      SDCC or XC8, so a straight "convert to C" port is not viable — it
      would have to re-become hand-tuned asm delay primitives anyway.
      Also confirmed: the raw `.asm` files in both `insider/Bootstrap/`
      copies are CRLF text that has been flattened/rewrapped (multiple
      MPASM statements and their trailing `;` comments run together onto
      one text line, with no reliable column boundary between code and
      comment) — NOT valid one-instruction-per-line MPASM as they sit;
      the matching `.lst` files (e.g. `Bootstrap/18FDBUG_v1r1.lst`,
      present for the 18F variant only) show the true, correctly
      one-instruction-per-line source and are the better reference to
      restore proper formatting from before attempting to assemble
      anything here. The `Source/DEMO1_*.asm` integration examples
      confirm the toolchain dependency directly: they use MPASM-specific
      `LIST P=<chip>`, `#include <P18F4620.INC>`-style vendor headers,
      and `CONFIG` directives — i.e. genuine MPASMX syntax, the
      assembler XC8 v1.x bundles/still supports (per this skill's
      Toolchains table), NOT XC8 v2.x/v4.x's `pic-as` (GNU/LLVM-MC
      syntax, incompatible directives) and not directly gpasm/SDCC's
      pic14/pic16 assembler backend without a syntax check of its own.
    status: present
    added: 2026-08-29

