  - id: gpsim-regression-harness
    category: project
    title: "gpsim's own regression/ test suite - a real precedent for scripting gpsim in a test harness"
    topic: >
      gpsim ships its own working test suite under regression/ (e.g.
      regression/breakpoints/) - real, runnable proof of how to
      orchestrate gpsim from a shell script, not a design guess. Each
      test dir has a .asm (built via gpasm -c, linked via gplink -s
      <chip>.lkr into .cod+.hex), a .stc script, and a Makefile `sim`
      target. Shared regression/make.regression's sim_%: %.cod rule
      runs `gpsim -i -I $(STARTUP_STC) -D STC="$<"` against a shared
      startup.stc (`load STC` / `run` / `quit`). The top-level
      regression/rt.sh runs `make <target> > LOGFILE` then `grep -e
      "FAILED" -e "PASSED" $LOGFILE` - pass/fail is a stdout-text grep,
      not an exit code. Pass/fail signal comes from an unconditional
      `.assert "'*** PASSED <msg>'"` (or FAILED) placed at the exact
      program point that means success, via four macros in
      /usr/share/gputils/header/coff.inc wrapping a generic `.direct`
      COD directive: `.assert`, `.sim`, `.print`, `.log`. Assembly-only
      (or SDCC inline-asm) - not usable from a .stc script alone.
      **CORRECTED 2026-08-29** after actually reading
      gpsim-0.32.2/src/cod.cc:483-530 (not just coff.inc's macro names/
      comments, which is all the first pass checked): only `.assert`
      (`'a'`) works as documented (becomes a `break asrt <addr>, <msg>`
      breakpoint). `.print`/`.log` (`'f'`/`'l'`) are unimplemented
      stubs - parsed, accepted, switch-case bodies empty, do nothing.
      `.sim` (`'e'`) does NOT run its command "when this PC is reached"
      - it ignores its address field entirely and runs once,
      unconditionally, at .cod-load time (same `add_command` call
      gpasm's own startup-script handling uses) - so `.sim "quit"` at a
      firmware "done" point does not work as a self-terminating
      checkpoint, it just quits immediately on load. The directive type
      that DOES run an arbitrary gpsim command exactly when a specific
      instruction executes without halting - the real "printf
      checkpoint" primitive - is `'c'`/`'C'` (CommandAssertion,
      src/breakpoints.cc:2166-2210), but it has NO macro in coff.inc.
      **CONFIRMED 2026-08-29** (same pass, via gputils-1.5.2 source at
      /mnt/data/Projects/gputils-1.5.2/gpasm/directive.c:_do_direct,
      line 2643, and util.c:coerce_str1, line 587): `.direct`'s first
      argument accepts ANY single-character string literal, coerced to
      its raw byte value with no whitelist restricting it to the four
      letters coff.inc's own macros happen to use - so a hand-written
      `.checkpoint macro x \n .direct "c", x \n endm`, used as
      `.checkpoint "myvar"` right after an instruction, DOES print
      myvar's live value at that exact point without halting the run
      (lowercase 'c' -> bPost=true, runs after the instruction; 'C' for
      before). This is a real, confirmed firmware-push mechanism for
      mid-run round-tripping - but not yet exercised end-to-end (no
      test has actually driven a .checkpoint-instrumented build through
      gpsim). Until that's done, the proven fallback for round-tripping
      a live value out of firmware under test remains the host-pull
      approach (write a global, halt, read it back via mdb's `Print`/
      gpsim's bare-symbol evaluation) - not a firmware-push mechanism,
      but the one with real mileage here.
    path: /mnt/data/Projects/gpsim-0.32.2/regression/
    relevance: >
      Investigated 2026-08-29 (via a fork) specifically to answer "how
      do we orchestrate gpsim from a shell script for pictest/lc-meter
      design-verification tests" - this is the answer: grep-the-log
      against an .assert-based PASSED/FAILED marker, not exit-code
      checking or manual step-counting. Confirms (independently of the
      build/sdcc.mk work done the same session) that gplink writes a
      .cod file as a side effect of every link with no extra flag
      needed - matches gpsim-source's earlier finding above.
      **Real gotchas found by actually RUNNING gpsim, not just reading
      source, not yet fully resolved:**
      (1) `-i` only suppresses the GUI attempt, it does NOT mean "exit
      when the script ends" - gpsim always drops to its interactive
      prompt (reading stdin) after a startup command file finishes,
      success or failure, unless that file itself runs `quit`.
      (2) a failed `load` aborts the REST of that command file
      (quit_parse=1/YYABORT in parse.yy) and falls straight to the
      interactive prompt - any run/quit lines after a bad load never
      execute; always confirm the .cod exists first.
      (3) **closing stdin (`</dev/null`) does NOT make gpsim exit
      cleanly on EOF** - empirically observed busy-looping printing the
      prompt (4.9MB in 15s) until `timeout` killed it. Any test-harness
      invocation of gpsim MUST be wrapped in `timeout` as a hard safety
      net, not rely on stdin redirection or an expected `quit` alone.
      (4) default verbosity is very high once any breakpoint/trace
      fires (full per-instruction register read/write logging,
      sim.verbosity Integer symbol, default 1) - a same-session
      `sim.verbosity = 0` assignment was tried and did NOT visibly
      suppress the flood in limited testing; the `-S disable` CLI flag
      (disables source-line loading, documented as speeding up
      regression runs) is the more likely correct lever but is
      UNTESTED - don't treat verbosity control as solved.
      (5) a minimal hand-written single-.assert test file (no GLOBAL
      declarations, no separate UDATA/CODE sections) built/loaded
      cleanly but did not visibly print PASSED, while the real
      regression/breakpoints/breakpoints.asm (GLOBAL-declared, proper
      sections, errorlevel -302) DID register the assert correctly per
      the `break` listing but then hit the verbosity flood from (4) and
      never exited in 15s - root cause of the discrepancy between the
      two files is UNRESOLVED. Whoever uses this next should isolate a
      minimal GLOBAL-declared single-assert test file before trusting
      the pattern for real pictest/lc-meter test firmware, and
      separately confirm SDCC's own .o/.cod output (not just
      gpasm-assembled .asm, which is all that was tested here) actually
      round-trips through gplink the same way real project code does -
      this pass only tested hand-written gpasm source, not an SDCC
      build.
    status: present
    added: 2026-08-29

