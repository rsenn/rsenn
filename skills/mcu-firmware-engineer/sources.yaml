  - id: roman-black-bresenham-timing
    category: blog
    title: "Zero Error Bresenham Timing Algorithm for Microcontrollers"
    topic: >
      Applying Bresenham's line algorithm to timer-tick accumulation so a
      binary timer overflow (256/65536 ticks) can generate an exact
      real-world period (e.g. 1 second) at any crystal speed, with zero
      cumulative drift - one accumulator variable, add the tick count each
      overflow, fire+subtract the target once the accumulator reaches it,
      carry the remainder forward as the correction for next time.
    url: "https://www.romanblack.com/one_sec.htm"
    relevance: >
      This is the actual origin/rationale of pictest's own
      `bresenham.h` (`BRESENHAM_DECL`/`BRESENHAM_INC8`/`BRESENHAM_COND`/
      `BRESENHAM_SUB`) - the project's standard timebase idiom, used in
      `miditest.c` and `rgbtest.c` to derive an exact 1ms tick from
      Timer0 overflows regardless of crystal frequency. Read this before
      touching or re-deriving that macro set, or before building an
      equivalent timebase on a new target - it explains *why* the
      accumulate/compare/subtract-remainder shape is correct (zero
      cumulative error) rather than just what the macros do.
    status: present
    added: 2026-08-29

  - id: roman-black-integer-degree
    category: blog
    title: "Fast Integer Degree Algorithm (XY vector to compass degree)"
    topic: >
      Converting an XY vector to a 0-360 degree value without ArcTan()/
      ArcCos(): a cheap 16-bit multiply+divide single-quadrant estimate
      (degree = y*45/x, ~4 deg error), a byte-comparison error-compensation
      pass tightening it to ~1 deg, then quadrant mapping via sign flags.
      ~196 bytes ROM on a PIC12F675.
    url: "https://www.romanblack.com/integer_degree.htm"
    relevance: >
      Reference for any future pictest/lc-meter work needing a direction/
      angle from an XY pair (accelerometer tilt, joystick, vector-based
      control) without paying for real trig on an 8-bit part - not yet
      used by any project here, kept for when it's needed.
    status: present
    added: 2026-08-29

  - id: roman-black-dtmf-algorithm
    category: blog
    title: "Black DTMF Decoding Algorithm (period-measurement, no FFT/Goertzel)"
    topic: >
      Decoding DTMF tones by measuring waveform period via comparator
      zero-crossing + crystal-accurate timing, not FFT/Goertzel - a HI-LO
      debounce (each half-period must be >=90% stable) rejects noise while
      also giving crude pattern sync; two decode strategies shown (weighted
      spectrum-style scoring over 30 periods, then a faster "triplet"
      pattern match over sequences of 3 consecutive periods). ~25 bytes RAM
      + 318 bytes ROM on a PIC12F675, no external crystal/specialty IC.
    url: "https://www.romanblack.com/DTMF/DTMF_alg.htm"
    relevance: >
      Reference algorithm for detecting DTMF (or any characteristic-
      frequency tone) on the smallest/cheapest PICs this project's build
      matrix already targets (12f1840-class parts) - relevant if a future
      project needs telephone/remote-control tone decoding without an
      external DTMF decoder chip.
    status: present
    added: 2026-08-29

  - id: roman-black-dtmf-remote-example
    category: project
    title: "DTMF_remote.c (worked example of the triplet DTMF algorithm)"
    topic: >
      Complete PIC12F675 (8MHz, EasyPIC6 board) firmware: DTMF-controlled
      relay (key '1' on, key '0' off) built directly on the triplet
      algorithm from roman-black-dtmf-algorithm above - comp_debounce()
      (220us stability sync), decode_triplets() (score sequences of 3
      periods against known DTMF patterns, threshold >60), make_beeps()
      for feedback.
    url: "https://www.romanblack.com/DTMF/DTMF_remote.c"
    relevance: >
      A complete, working reference implementation of the DTMF triplet
