    status: present
    added: 2026-08-29

  - id: roman-black-btc-sound
    category: blog
    title: "BTc (Binary Time Constant) 1-bit sound encoding"
    topic: >
      Encoding audio to 1 bit/sample for single-GPIO-pin playback by
      modeling an RC charging curve with a BINARY time constant (distance/2,
      /4, /8 - a right-shift, not the electrical 63.2%/0.632 float
      multiply) so the whole encode+decode is 8-bit add/subtract/shift, no
      floating point. Source waveform is pre-scaled to the center half of
      the output range; encoding picks whichever of the two possible next
      bits moves the running RC-model value closer to the target sample.
    url: "https://www.romanblack.com/BTc_alg.htm"
    relevance: >
      Reference for cheap voice/sound-effect playback from a single PIC
      pin (no DAC, no PWM audio codec, no floating point) - relevant if a
      future project wants talking-device-style audio feedback on an
      8-bit part.
    status: present
    added: 2026-08-29

  - id: roman-black-picthread
    category: blog
    title: "PIC-thread: cooperative multitasking via THREAD_START/BREAK/END macros"
    topic: >
      Three macros (THREAD_START(), THREAD_BREAK, THREAD_END()) that turn
      sequential C code into a cooperative-multitasking "thread" using a
      per-thread sequence-number array (seq[]) to resume at the right
      THREAD_BREAK each pass through the main loop - plus two alternative
      scheduling styles (timeslice via TMR0/TMR1, and loop-frequency/modulo
      threading for tasks that only need to run every Nth pass).
    url: "https://www.romanblack.com/PICthread.htm"
    relevance: >
      A lightweight cooperative-multitasking pattern worth considering
      before reaching for a real RTOS on an 8-bit part with tight RAM -
      not yet used by any project here (pictest/lc-meter currently use
      plain flat main-loop polling + ISRs), but the natural next step if a
      project's main loop ever needs genuinely independent concurrent
      tasks without an ISR-driven state machine per task.
    status: present
    added: 2026-08-29

