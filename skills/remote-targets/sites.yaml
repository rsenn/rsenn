# sites.yaml - the ONLY place for site-specific data of the remote-targets skill.
# Everything here is about a concrete machine; generic how-to lives in knowledge/.
#
# Rules
#  - No secrets. Reference them: key file paths, "pass:<entry>", "env:<VAR>", or "ask".
#  - Addresses below are documentation placeholders (RFC 5737 / example.*). Replace on real use.
#  - Keep an id short and stable; targets.yaml ids go in `targets`.
#
# Schema (all keys optional except id-level `targets` and `access`)
#
#   <site-id>:
#     description: free text
#     aliases: [names the user may say]
#     targets: [ids from targets.yaml this site can build/run for]
#     arch: aarch64 | armv7l | x86_64 | wasm32 ...      # of the hardware / runtime
#     os: free text                                      # distro / Android version / Windows build
#     access:                                            # one block per transport that exists
#       ssh:     {alias, host, port, user, key, jump, opts, forward, notes}  -> knowledge/transports/ssh.md
#                (alias = Host entry in ~/.ssh/config; if set, `ssh <alias>` is enough)
#       sshfs:   {remote, mountpoint, opts, notes}               -> knowledge/transports/sshfs.md
#       adb:     {serial | tcp, notes}                           -> knowledge/transports/adb.md
#       serial:  {device, baud, settings, login, notes}          -> knowledge/transports/serial.md
#       rdp:     {host, port, user, password_ref, opts}          -> knowledge/transports/rdp.md
#       vnc:     {host, port, display, password_ref, tunnel}     -> knowledge/transports/vnc.md
#       debug:   {kind: gdbserver|lldb-server|cdb|msvsmon|inspect, host, port, notes}
#                                                                -> knowledge/transports/remote-debug.md
#     use:                    # which transport serves which activity (the "at a glance" map)
#       run: ssh              # run commands / tests
#       transfer: sshfs       # move files (sshfs | ssh | adb | rdp-drive)
#       debug: debug          # key under access
#       console: serial       # boot/rescue console
#       gui: vnc              # see/drive the desktop
#     dirs:
#       repos:  home-relative dir with git clones for scripts/rt-sync.sh (default Sources)
#       work:   remote scratch/build dir (safe to wipe)
#       deploy: where artifacts are installed/run from
#       mount:  local mountpoint of the sshfs, if any
#     services: [{name, port, proto, notes}]             # port layout on the device
#     facts:    {tool/version/space info found by scripts/probe.sh, dated}
#     notes:    [dated quirks specific to this machine]
#     example: true           # delete on real entries; lint ignores addresses in this file anyway

version: 1

sites:

  pi-lab:                                   # EXAMPLE: Raspberry Pi on the bench network
    example: true
    description: Raspberry Pi 4, Raspberry Pi OS (64-bit kernel, check userland arch), headless
    aliases: [pi, raspberry]
    targets: [linux-glibc]
    arch: aarch64
    os: Raspberry Pi OS bookworm
    access:
      ssh:
        host: 192.0.2.10
        port: 22
        user: pi
        key: ~/.ssh/id_ed25519_lab
        opts: [-o, ConnectTimeout=10, -o, BatchMode=yes, -o, ControlMaster=auto, -o, "ControlPath=~/.ssh/cm-%C", -o, ControlPersist=10m]
      sshfs:
        remote: "pi@192.0.2.10:/home/pi/work"
        mountpoint: ~/mnt/pi-lab
        opts: [reconnect, ServerAliveInterval=15, follow_symlinks]
      serial:
        device: /dev/serial/by-id/usb-EXAMPLE_UART-if00-port0
        baud: 115200
        settings: 8N1, no flow control
        login: ask
      debug:
        kind: gdbserver
        host: 192.0.2.10
        port: 2345
        notes: start on the pi, connect from here; or tunnel with ssh -L 2345:localhost:2345
      vnc:
        host: 192.0.2.10
        port: 5900
        display: ":0"
        password_ref: "pass:rt/pi-lab-vnc"
    use: {run: ssh, transfer: sshfs, debug: debug, console: serial, gui: vnc}
    dirs: {work: /home/pi/work, deploy: /home/pi/deploy, mount: ~/mnt/pi-lab}
    services:
      - {name: sshd, port: 22, proto: tcp}
      - {name: gdbserver, port: 2345, proto: tcp, notes: started on demand}
      - {name: vnc, port: 5900, proto: tcp}
    facts: {}          # fill from scripts/probe.sh
    notes: []

  phone-termux:                             # EXAMPLE: Android phone with Termux and adb
    example: true
    description: Android phone, Termux from F-Droid, sshd in Termux, USB adb available
    aliases: [phone, android, termux]
    targets: [termux, android-ndk]
    arch: aarch64
    os: Android 14
    access:
      ssh:
        host: 192.0.2.20
        port: 8022
        user: u0_a123
        key: ~/.ssh/id_ed25519_lab
        opts: [-o, ConnectTimeout=10, -o, BatchMode=yes]
        notes: sshd must be started in Termux (`sshd`); not persistent across Termux restarts
      adb:
        serial: EXAMPLE0123456
        tcp: "192.0.2.20:5555"
      sshfs:
        remote: "u0_a123@192.0.2.20:/data/data/com.termux/files/home/work"
        mountpoint: ~/mnt/phone
        opts: ["-p", "8022", reconnect, ServerAliveInterval=15]
      debug:
        kind: gdbserver
        host: 192.0.2.20
        port: 5039
        notes: via `adb forward tcp:5039 tcp:5039` for NDK binaries
    use: {run: ssh, transfer: sshfs, debug: debug}
    dirs:
      work: /data/data/com.termux/files/home/work     # Termux target
      deploy: /data/local/tmp/deploy                   # android-ndk target (adb)
      mount: ~/mnt/phone
    services:
      - {name: termux-sshd, port: 8022, proto: tcp}
      - {name: adbd-tcp, port: 5555, proto: tcp}
    facts: {}
    notes: []

  win-build:                                # EXAMPLE: Windows machine with MSVC + MSYS2 + Cygwin
    example: true
    description: Windows 11 VM; OpenSSH server (default shell cmd), MSVC 2022, MSYS2 in C:\msys64, Cygwin in C:\cygwin64
    aliases: [windows, win]
    targets: [msvc, msys, cygwin, mingw]
    arch: x86_64
    os: Windows 11
    access:
      ssh:
        host: win-build.example.net
        port: 22
        user: builder
        key: ~/.ssh/id_ed25519_lab
        notes: default shell cmd.exe; use `bash -lc` / `msys2_shell.cmd -c` to enter MSYS2
      rdp:
        host: win-build.example.net
        port: 3389
        user: builder
        password_ref: "pass:rt/win-build"
        opts: ["/cert:ignore", "+clipboard", "/drive:share,/tmp/share"]
      debug:
        kind: msvsmon
        host: win-build.example.net
        port: 4026
    use: {run: ssh, transfer: ssh, debug: debug, gui: rdp}
    dirs: {work: 'C:\work', deploy: 'C:\deploy'}
    services:
      - {name: openssh, port: 22, proto: tcp}
      - {name: rdp, port: 3389, proto: tcp}
      - {name: msvsmon, port: 4026, proto: tcp}
    facts: {}
    notes: []

  termux:                                   # REAL: user's phone, Termux over ssh + sshfs
    description: Android phone running Termux; sshd in Termux; home and $PREFIX mounted via sshfs
    aliases: [termux, phone, android]
    targets: [termux]
    arch: aarch64
    os: Android (Termux)
    access:
      ssh:
        alias: termux                       # Host termux android in ~/.ssh/config
        host: 192.168.178.61
        port: 22222
        opts: [-o, ConnectTimeout=10]       # ssh config has ConnectTimeout 0: bound it ourselves
        forward: {agent: true, x11: true, x11_trusted: true}
        notes: PasswordAuthentication no (key/agent only); user maps to the Termux app uid
        tunnel: "when the phone is not on the LAN the same sshd is reachable as `ssh -p22222 localhost` through a tunnel (seen 2026-11-15); user u0_a391; host key of localhost is not the LAN one"
      sshfs:
        remote: "termux:.."                 # one level above Termux $HOME == dirname of $PREFIX
        mountpoint: ~/mnt/termux
        opts: [reconnect, transform_symlinks]
        notes: |
          mount: sshfs termux:.. ~/mnt/termux -o reconnect,transform_symlinks
          gives two dirs: ~/mnt/termux/home/ (Termux $HOME) and ~/mnt/termux/usr/ (Termux $PREFIX).
          transform_symlinks makes absolute symlinks inside $PREFIX resolve under the mount.
    use: {run: ssh, transfer: sshfs}
    dirs:
      repos: Sources                         # home-relative; clones live in ~/Sources/<proj> (rt-sync default)
      work: ~/mnt/termux/home                # local view of the Termux home
      deploy: ~/mnt/termux/usr               # local view of $PREFIX
      mount: ~/mnt/termux
      sysroot: ~/sysroots/termux/usr         # local rsync copy of $PREFIX (js-engines `make sysroot-termux`, 1.2 GB); cfg-termux prefers it over the mount
    services:
      - {name: termux-sshd, port: 22222, proto: tcp}
      - {name: sshd, kind: runit, dir: "$PREFIX/var/service/sshd", run: "sshd -p22222 -D -e", state: "enabled 2026-11-15 (the packaged sshd service edited to port 22222; the manual sshd was killed); logs in $PREFIX/var/log/sv/sshd/current"}
      - {name: tunnel, kind: runit, dir: "$PREFIX/var/service/tunnel", run: "ssh -p22224 <user>@<jump host> -L 5900:127.0.0.1:5900 -R 22222:127.0.0.1:22222 -N with BatchMode, ExitOnForwardFailure, ServerAliveInterval=15 x3, ConnectTimeout=15, 5 s sleep before each start", state: "created 2026-11-15, left down because a manual ssh -R tunnel is what carries the workstation access; cut over from the phone: kill that ssh, then sv-enable tunnel"}
    facts:
      probed: 2026-10-14
      android: "15 (API 35), kernel 5.4.242, aarch64, 8 cpus, 7.3 GB RAM"
      compilers: "clang 21.1.8 (gcc/cc -> clang-21), tcc 0.9.27"
      tools: "gdb 16.3, gdbserver, lldb 21.1.8, strace, ltrace, rsync, python3, node, wasmtime, cmake, ninja, git"
      env: "LD_PRELOAD=libtermux-exec.so (required to exec anything); see knowledge/targets/termux.md#debug"
      cross: "VERIFIED 2026-11-20: NDK r27c (/mnt/data/opt/android-ndk-r27c) + the local sysroot copy via cfg-termux; cross-built binaries ran on the phone. Native SpiderMonkey build on the phone: configure stops at the NDK check (js-engines TODO.md); ~/fake-ndk and ~/.cargo/bin (rustup 1.29.3 with no toolchain, cbindgen 0.29.4) were left there by an ollama-repl run."
    notes:
      - "list project dirs: (cd ~/mnt/termux/home/; set -- */.git; echo \"${@%/*}\")"
      - "real gcc may be available from extra Termux repositories (not yet tried)"

  raspi4:                                   # REAL: user's Raspberry Pi 4, ssh without password
    description: Raspberry Pi 4 (Cortex-A72, 4 cpus, 1.8 GB RAM), 64-bit Debian 11 bullseye userland, headless, always on
    aliases: [pi, raspi, raspi4, raspberry, openschggy]
    targets: [linux-glibc]
    arch: aarch64
    os: Debian GNU/Linux 11 (bullseye), glibc 2.31, kernel 5.15.45-v8
    access:
      ssh:
        host: 192.168.178.63
        port: 22
        user: pi
        opts: [-o, ConnectTimeout=10, -o, BatchMode=yes]
        notes: key/agent login, no password; host key already in known_hosts on the workstation; the IP is DHCP (dynamic), re-check if it stops answering
      sshfs:
        remote: "pi@192.168.178.63:/"        # the whole root; a second mount pi@192.168.178.63: is ~/mnt/pi-home
        mountpoint: ~/mnt/pi-root
        opts: [reconnect]
        notes: only the source for the local sysroot copy below; do not build through it (every lookup is a round trip)
    use: {run: ssh, transfer: ssh}
    dirs:
      repos: Sources                         # home-relative; existing clones in ~/Sources (rt-sync default)
      work: ~/ci-work                        # to be created on first use; /tmp is a 900 MB tmpfs, too small for builds
      deploy: ~/ci-work/deploy
      mount: ~/mnt/pi-root
      sysroot: ~/sysroots/pi                 # local copy (js-engines `make sysroot-pi`, 1.2 GB; ~/sysroots -> /mnt/data/sysroots); refresh after installing dev packages on the Pi
    services:
      - {name: sshd, port: 22, proto: tcp}
    facts:
      probed: 2026-11-15
      os: "Debian 11 bullseye (not the current Raspberry Pi OS bookworm), dpkg arch arm64, no foreign architectures, glibc 2.31-13+deb11u14"
      hw: "4 cpus, MemTotal 1.8 GB (1.5 GB available), / 29 GB with 12 GB free, /boot 256 MB, /tmp tmpfs 900 MB; heat 51 C idle, governor performance"
      compilers: "gcc 10.2.1 (Debian 10.2.1-6), clang"
      glibc: "CORRECTED 2026-11-20: libc6 is 2.36-9+deb12u14 (ldd --version on the Pi, libc.so.6 in the sysroot copy), not 2.31: the system is a mix of bullseye (os-release, gcc 10.2.1, libstdc++ 6.0.28) and bookworm libc6; read libc.so.6, not os-release"
      cross: "VERIFIED 2026-11-20: cfg-aarch64 (c-utils/cfg.sh) = host clang 22 + lld, --target=aarch64-linux-gnu --sysroot=~/sysroots/pi; a zlib hello built that way ran on the Pi (scp to /tmp, zlib 1.2.11). No cross gcc installed on the workstation or needed."
      tools: "cmake 3.18.4 (old: no cmake_language(DEFER), the minimum for projects here), ninja, make, git, gdb, strace, perf, valgrind, rsync, python3; no gdbserver/lltb/ltrace/qemu/node/wasmtime found by probe"
      dev_packages: "installed: libx11-dev libgl-dev libglfw3-dev libssl-dev zlib1g-dev libsqlite3-dev libpq-dev libffi-dev libasound2-dev libportaudio2; not installed: libwebsockets-dev libopencv-dev"
      net: "FIXED 2026-11-19: eth0 DHCP now by NetworkManager (profile eth0-dhcp), ifupdown eth0 stanza and systemd-networkd disabled, persistent journal on, backup /root/net-backup. BEFORE: ifupdown (dhclient eth0, unsupervised) + NetworkManager (eth0 unmanaged, only wlan0) + systemd-networkd (stale eth0.network -> br0, br0 files *.disabled) all enabled; DHCP lease 10 days; journald volatile; pi has passwordless sudo; no dhcpcd, no runit (only runit-helper); dump1090-fa crash-loops (no SDR stick), piaware not installed"
      wifi: "2026-11-19: NM profile ankh-morporkh (secret only in the Pi's root-only keyfile); dispatcher 90-wifi-off-on-ethernet disconnects wlan0 while eth0 is up and its gateway pings, reconnects otherwise; verified by a 50 s eth0 outage"
      other_use: "also runs ADS-B software (dump1090-fa, piaware, opensky-feeder): do not stop services or reboot without asking"
    notes:
      - "native builds are slow and RAM-limited (1.8 GB): use -j2 to -j3 if building here, prefer the cross build with a bullseye sysroot"
      - "~/Sources, ~/Projects hold the user's own clones; never write there except via rt-sync.sh"

  workstation:                              # REAL: this development machine (local, no transport)
    description: Linux x86_64 dev workstation (Ubuntu); builds locally, qemu-user binfmt registered for aarch64
    aliases: [local, host, workstation]
    targets: [cosmo, musl, dietlibc, mingw, emscripten, wasi]
    arch: x86_64
    access: {}
    use: {run: local}
    dirs:
      work: ~/Sources
      tools: ~/Sources/cosmopolitan            # Cosmopolitan source clone (master 4.x); tool/cosmocc/README.md is the toolchain reference
    facts:
      probed: 2026-10-14
      disk: "root fs 100% full, ~1.5 GB free (check `df -h /` before installing toolchains; cosmocc 4.0.2 needs 1.4 GB extracted)"
      binfmt: "qemu-aarch64 and others registered; no APE entry; APE runs via shell self-extraction"
      cross: "probed 2026-11-15: clang 22.1.8 (also clang-18) lists aarch64, x86-64 and x86 targets; lld and ld.lld in /usr/local/bin; qemu-aarch64 8.2.2; no gcc-aarch64-linux-gnu, no /usr/aarch64-linux-gnu sysroot, no debootstrap; /opt/android-ndk-r10e only (too old)"
      docker: "probed 2026-11-15: docker 29.1.3 usable by the user, overlay2, data root /mnt/data/docker; images present: alpine:3.24 (others are unrelated)"
      disk2: "probed 2026-11-15: / has ~31 GB free (86% used), /mnt/data (sdb1) has ~620 GB free; put large caches (sysroots, NDK, ccache, docker) on /mnt/data"
    notes: []
