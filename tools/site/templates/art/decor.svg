<!-- Decoration sprites: one <symbol> per piece, picked up by id.
       bullet       list marker (ul li, .checks li)             16x16
       rule         tile repeated along hr and landing sections  any x 8
       btn          button frame, 9-slice, .btn                  data-slice = corner size
       btn-primary  same for .btn.primary
     data-tint="accent|fg|muted|line" paints the symbol in that theme colour
     (single-colour art: only its silhouette is used). Without data-tint the
     symbol is used as authored, colours included. btn/btn-primary are never
     tinted (CSS cannot 9-slice a mask), so give them real colours. -->
<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="bullet" viewBox="0 0 16 16" data-tint="accent">
    <path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z"/>
  </symbol>
  <symbol id="rule" viewBox="0 0 32 8" data-tint="line">
    <rect x="1" y="3" width="15" height="2"/>
    <circle cx="22" cy="4" r="2"/>
    <circle cx="29" cy="4" r="1"/>
  </symbol>
  <symbol id="btn" viewBox="0 0 24 24" data-slice="8">
    <path d="M8 1.5h8l6.5 6.5v8l-6.5 6.5H8L1.5 16V8z" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
  </symbol>
  <symbol id="btn-primary" viewBox="0 0 24 24" data-slice="8">
    <path d="M8 1.5h8l6.5 6.5v8l-6.5 6.5H8L1.5 16V8z" fill="#0b7c72" stroke="#065a53" stroke-width="1.5"/>
  </symbol>
</svg>
